[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-tracepath-plugin"
version = "0.8.0"
description = "Printable PDF cable traces for technicians and field engineers, for NetBox."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12.0"
authors = [{ name = "JP" }, { name = "Claude Sonnet 5.5 (Anthropic)" }]
keywords = ["netbox", "netbox-plugin", "cable", "trace", "pdf", "print"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
]
# Deliberately empty: the plugin runs on a vanilla NetBox install with nothing
# extra to install. The PDF writer and layout engine use the standard library
# only, and the one font is bundled as package data.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_tracepath_plugin*"]

[tool.setuptools.package-data]
netbox_tracepath_plugin = ["templates/**", "fonts/*"]
